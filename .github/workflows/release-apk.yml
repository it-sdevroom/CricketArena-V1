name: Publish APK

# Cut a downloadable release so the app can be shared by link, with no store
# account, no review and no fee. Tag a version and this attaches the APK to a
# GitHub Release; the download URL is public and permanent.
#
#   git tag v2.2.0
#   git push origin v2.2.0
#
# Or run it by hand from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label, e.g. v2.2.0'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # React Native's Gradle plugin pins its Kotlin toolchain to exactly 17,
      # and will not substitute a newer JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No setup-android step: the ubuntu runners already ship the Android SDK
      # with platforms and build-tools, and ANDROID_HOME already set. The action
      # only duplicated that, and failed doing it.

      - run: npm ci

      # Same gate as the deploy workflow: a broken build must not become a
      # release that people download.
      - name: Verify
        run: npm run check

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Build the APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Name it after the version
        id: apk
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk "cricket-arena-${VERSION}.apk"
          echo "path=cricket-arena-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version }}
          name: Cricket Arena ${{ steps.apk.outputs.version }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## Install on Android

            1. Download the `.apk` below on your phone.
            2. Open it. Android will warn that it is from an unknown source —
               tap **Settings**, allow installs from your browser, then **Install**.
            3. It installs over any earlier version and keeps you signed in.

            The warning is normal for an app distributed outside the Play Store.

            ## Or use it in a browser

            No install needed: https://mnauman228-coder.github.io/CricketArena-V1/
